services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: agentos
      POSTGRES_USER: agentos
      POSTGRES_DB: agentos_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos_test"]
      interval: 2s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
  s3:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 30
